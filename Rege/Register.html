<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Now</title>
    <link rel="stylesheet" href="Rege_style.css">
</head>
<body>

    <div class="container">
        <form class="register-form">

            <img src="/Rege/Rege icon/rege logo.jpg" alt="Logo" class="logo">

            <h1>Register Now</h1>

            <div class="input-box">
                <img src="/Rege/Rege icon/man img.jpg" alt="User" class="icon">
                <input type="text" placeholder="Enter your name" required>
            </div>

            <div class="input-box">
                <img src="" alt="Email" class="icon">
                <input type="email" placeholder="Enter your email" required>
            </div>

            <div class="input-box">
                <img src="" alt="Password" class="icon">
                <input type="password" placeholder="Enter your password" required>
            </div>

            <div class="input-box">
                <img src="" alt="Password" class="icon">
                <input type="password" placeholder="Confirm your password" required>
            </div>

            <div class="input-box">
                <img src="" alt="Phone" class="icon">
                <input type="tel" placeholder="Enter your phone number" required>
            </div>

            <button type="submit">Register Now</button>

            <a href="../Head File/hub.html" class="home-btn">Back to Home</a>

        </form>
    </div>

</body>
</html>
